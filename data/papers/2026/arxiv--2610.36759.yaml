summary: Multilingual multi-hop document question answering (MMHop-DocQA) requires locating and integrating
  evidence across complex layouts, document pages, and diverse languages. Existing approaches include
  single-pass processing and adaptive tool use, but learning to coordinate evidence acquisition, cross-page
  integration, and answer verification remains challenging. To address this challenge, we present DocSkill,
  an agentic framework with a learned skill-orchestration policy for adaptive evidence acquisition and
  reasoning. The policy selects, revisits, or skips skills according to the evolving evidence state. To
  construct supervision for skill orchestration, bounded Monte Carlo Tree Search (MCTS) explores alternative
  skill trajectories offline. These trajectories provide demonstrations for supervised fine-tuning (SFT)
  and preference pairs for Direct Preference Optimization (DPO). We further introduce MMHop-DocBench,
  a multilingual multi-hop document QA dataset with training and test splits, containing 60K QA pairs
  across 10 languages and eight document domains. Its HopGen pipeline builds hierarchical page-element
  graphs to derive traceable cross-page evidence paths and generate grounded QA pairs with page- and element-level
  evidence annotations. Experiments show that DocSkill with Qwen3-VL-8B achieves 41.0 accuracy and 49.2
  F1 on MMHop-DocBench, exceeding the strongest evaluated baseline by 5.5 and 6.3 points, respectively,
  and achieving competitive performance on MMLongBench-Doc and DocBench.
