summary: 'EVICALC, our system for the DocSem shared task, achieved 8.61% joint accuracy on 1,730 tasks
  in the official final test evaluation. It reads a PDF, selects a passage, asks a language model to write
  an arithmetic expression, and evaluates that expression in local code. Saved intermediate results support
  inspection of failures. A separate public-validation run achieved 92.17% answer accuracy and 1.00 evidence
  F1. The configurations and metrics differ, so these scores are not a controlled comparison. Our manual,
  post-hoc analysis is descriptive: in one inspected case, optical character recognition (OCR) and block
  grouping merged the relevant passage into another block, and the system answered from unrelated text.
  An exploratory study of reading page images on 100 documents returned evidence identifiers for only
  22 documents. These descriptive findings motivate further evaluation; they do not establish the causes
  of the overall score.'
