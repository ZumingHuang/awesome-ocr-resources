summary: Optical character recognition (OCR) for Tibetan is evaluated predominantly by character error
  rate (CER). Tibetan marks syllable boundaries but does not mark word boundaries, so a word error rate
  requires a segmenter. This study evaluates nine recognizer configurations on typeset, woodblock and
  two handwritten script styles, alone and in combination, and reports syllable- and word-level error
  rates, to our knowledge the first for Tibetan OCR. The configurations span CTC models, TrOCR encoder-decoders
  with and without post-training quantization, and a vision-language model, and each is scored under CER,
  the syllable error rate (SER) and three segmented word error rates (SWER). CER ranks systems largely
  as the higher-level rates do (Kendall $τ\geq 0.833$), with one pair ordered oppositely. On the effect
  of joint training, CER and SER record significant changes of opposite sign in 7 of 64 comparisons. SER
  needs no segmenter and ranks systems as SWER does under two of the three segmenters ($τ\geq 0.889$).
  The output of each configuration is also tagged for part of speech, annotated for named entities and
  machine translated, and each result is compared with that obtained on the reference text. As rough guidance,
  translation chrF of 60 is reached at SER of 0.047 or below and part-of-speech preservation of 0.8 at
  0.078 or below, while no error rate separates the systems that reach entity preservation of 0.6 from
  those that do not.
