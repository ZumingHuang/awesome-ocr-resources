summary: Electrochemistry is central to solving many modern-day challenges, including energy storage systems
  for a sustainable future, and its advancement relies heavily on the data from past findings. Existing
  automated pipelines are limited by text-only architectures, context fragmentation, and numerical hallucinations
  - collectively preventing accurate, large-scale curation of property databases. We introduce ElectrochemLLM,
  a multimodal information extraction pipeline that jointly identifies structured electrochemical records
  encompassing electrolyte compositions, electrode materials, cell configurations, and their measured
  physicochemical properties from unstructured scientific PDFs at scale. By combining hybrid document
  parsing with vision-capable LLM orchestration, the pipeline extracts verifiable, structured data across
  text, tables, and figures. Evaluated on the battery-electrolyte subset of our manually annotated benchmark
  of 232 papers, ElectrochemLLM achieves an F-1 score of 0.97, and has been applied to curate ElectroChemDB,
  a structured database spanning 15,000 electrochemical research articles. We demonstrate the utility
  of this resource by training machine learning models for electrolyte property prediction, illustrating
  a complete pathway from unstructured literature to predictive materials discovery.
