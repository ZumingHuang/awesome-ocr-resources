summary: Large language models are typically adapted to a task either by placing knowledge in the input
  context, which keeps it external and re-encodes it on every call, or by fine-tuning, which internalizes
  it but demands a costly round of optimization per task. We aim to internalize the knowledge carried
  by a context directly into model parameters, without per-task optimization and without keeping the context
  in the input at inference time. To this end, we propose CLIK, a context-conditioned parameter generator
  that maps a given context to LoRA parameters for internalizing knowledge in a single forward pass through
  a Transformer encoder with cross-attention, requiring no test-time gradient updates. Once the generated
  LoRA is inserted into a frozen base model, the model answers downstream queries from the query alone,
  having internalized the context into its weights rather than re-reading it. Because the adapter depends
  only on the context, it is generated once and reused for every query on the same document, so the cost
  of reading that document is amortized across queries. On document question answering, CLIK substantially
  improves over the no-context base model and outperforms existing hypernetwork-based generators, while
  remaining behind a base model that reads the context directly, and it carries over to multi-turn dialogue
  without any multi-turn-specific training. Analysis further shows that the context-dependent part of
  the generated adapter concentrates in a compact and specific substructure.
