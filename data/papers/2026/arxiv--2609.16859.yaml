summary: 'To train handwritten text recognition systems we need word images and their corresponding transcriptions,
  and these transcriptions are produced manually. For a script that can be read by only a small number
  of specialists, this manual transcription is a limitation, because the trained models are supposed to
  save the time of those same specialists. A relevant question therefore arises: how many transcriptions
  are needed before a recogniser becomes useful, and how much of that cost can pretraining remove? In
  this study the answer is measured directly for handwritten Devanagari. We keep the recogniser, optimiser
  and evaluation protocol the same and change only the number of real transcribed words used for fine-tuning
  across nine budgets from 10 to 4,000 and four initialisation regimes, with six seeds at every point.
  The resulting curves are then converted into annotation-equivalent terms. A CER of 0.50 is reached by
  supervised synthetic pretraining using only 81 transcribed words, whereas random initialisation requires
  355, which gives a label multiplier of 4.40 [3.56, 4.99]. There is a zero-shot reference point as well:
  with no real transcribed words at all, this pretraining is worth about 136 of them. This advantage gets
  smaller as the target accuracy improves, and at the most demanding target we measure, it cannot be distinguished
  from no saving at all. A fourth arm in which only the encoder is transferred separates the effect of
  the pretraining method from that of transfer scope, and masked image modelling is observed to transfer
  negatively over a bounded range of budgets. We emphasise that the scarcity in this study is constructed
  by subsampling a large corpus.'
