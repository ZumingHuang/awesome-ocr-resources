summary: 'Traditional document parsing systems use Markdown as their output representation, which is effective
  for linear text but does not fully preserve fine-grained spatial structure, table geometry, visual hierarchy,
  or rendering semantics. We show that HTML is advantageous for heterogeneous and layout-sensitive documents
  whose representations must remain editable, inspectable, and reusable, and introduce AmbiHTMLBench to
  systematically study this setting. In this benchmark, given a real-world document, a model must recover
  executable HTML that preserves its content, organization, and visual appearance. The benchmark contains
  1,115 diverse pages with structured annotations and evaluates predictions in two different ways: The
  objective protocol aligns ground-truth and predicted rendered blocks and measures table fidelity, page-level
  text error, and a two-dimensional layout consistency; a complementary reference-anchored protocol measures
  perceived fidelity by aligning LLM judges with human preferences. Across ten primary multimodal systems,
  the best objective score is 0.8092, while the subjective winner is different, demonstrating that automatic
  decomposition and human-perceived fidelity capture complementary properties. We further fine-tune a
  small-parameter expert model and find that task-specific adaptation yields good performance on document-to-HTML
  reconstruction task. These results position AmbiHTMLBench as a diagnostic testbed for building smarter
  and more logical document parsing systems.'
