summary: Handwritten mathematical expression recognition (HMER) refers to the task of recognizing and
  converting handwritten mathematics into a parsable markup language, usually LaTeX. No current state-of-the-art-competitive
  system adjusts to the way a specific person writes, and the domain gap between training images (usually
  digital or perfectly binarized) and images physically taken with a camera used in inference has received
  fairly little attention for this specific problem. We characterize this domain gap through fragmentation
  and stroke-width analyses of the images as well as introduce a writer-adaptive fine-tuning pipeline
  to MFH-CoMER in an attempt to address it. We further introduce sample author-specific datasets, consisting
  of five handwriting category subsets from two authors, and evaluate using a McNemar's test and permutation
  tests adapted to limited data. Results suggest an increase in expression recognition rate and a decrease
  in CER for digital handwriting but more varied results for physical handwriting, with the model struggling
  for handwriting articles that the base model can already evaluate well. Nonetheless, adapted models
  were found to have improved results for four out of five subsets. Statistical testing results suggest
  a consistency in improvement for two of the tested author-specific subsets. Our results point towards
  the potential feasibility of writer adaptation for the HMER task.
