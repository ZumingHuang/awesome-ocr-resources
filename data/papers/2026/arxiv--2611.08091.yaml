summary: Despite recent progress in handwritten text recognition, medieval Arabic scientific manuscripts
  remain an open challenge for current vision-language models (VLMs) due to cursive ligatures, variable
  diacritization, and more importantly the lack of training data. This paper aims to address this gap,
  by proposing the first annotation guidelines dedicated to the transcription of scientific Arabic manuscripts
  inspired by textual criticism, a well-established approach to historical text editing. We then propose,
  ATHAAR, a new dataset manually annotated following this guideline. Unlike previous resources in the
  field, ATHAAR varies both witnesses of the same text, calligraphic styles, and content to deal with
  texts but also numerals. Relying on state-of-the-art VLMs, we finally design a set of experiments to
  study models transfer across scripts, chapters, and treatises. Our findings highlight the limitations
  of current systems when faced with the specificities of ancient scientific texts.
