summary: While massive, closed-source Vision-Language Models (VLMs) set strong benchmarks for document
  understanding, their dependence on commercial APIs limits adoption in institutional archives due to
  data autonomy concerns, recurring costs, and the environmental footprint of hyperscale computing. This
  is especially acute in heritage digitization, where documents include historical handwriting, domain-specific
  terminology (e.g., jewelry, prehistory, architecture), and non-standard layouts requiring high-dimensional
  structured extraction. We present a comparative study of eight open-source lightweight VLMs (up to 7B
  parameters) for Optical Character Recognition (OCR)-to-structure across three university heritage collections.
  Given a document image, models must extract text and generate schema-compliant JSON, enabling automatic
  validation and downstream use. We evaluate models under a constraint-aware protocol across zero-shot,
  few-shot, and fine-tuning settings, measuring extraction fidelity and structured-output quality using
  Character Error Rate (CER), Approximate Normalized Levenshtein Similarity (ANLS*), and mean Average
  Precision F1 (mAP-F1). Against a fine-tuning baseline, we further test the independent impact of (i)
  hyperparameter optimization, (ii) classical image preprocessing (illumination flattening, denoising,
  and CLAHE), and (iii) multi-stage training. Finally, we analyze the trade-off between dataset-specific
  fine-tuning and a single multi-dataset checkpoint, where joint training enables one model to operate
  across collections but can shift performance between datasets. Overall, we show that carefully adapted
  VLMs with up to 7B parameters can provide a sustainable, private, high-performing alternative to manual
  transcription or commercial black-box systems, and we offer actionable guidance for heritage institutions
  seeking institution-controlled OCR-to-JSON extraction.
