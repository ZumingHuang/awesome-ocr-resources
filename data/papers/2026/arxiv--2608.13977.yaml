summary: Video analysis software is a staple of the modern undergraduate physics laboratory, enabling
  students to extract quantitative kinematic data from real-world phenomena. In this paper, we introduce
  PhysTrackX, a modern, open-source video analysis framework designed to minimize cognitive load and maximize
  pedagogical value. Built with a streamlined graphical interface, PhysTrackX features a comprehensive
  set of functionalities including video trimming, spatial calibration, and coordinate system definition
  with robust, machine learning based tracking. Furthermore, it introduces an integrated optical character
  recognition (OCR) module for synchronizing kinematic motion with external digital sensor displays, an
  interactive geometry plugin for in-situ spatial measurements, and a data management tool. In this article,
  we introduce the software and its functionality through some case studies.
