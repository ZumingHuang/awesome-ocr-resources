summary: 'Document layout analysis (DLA) faces a long-standing dilemma: existing methods either capture
  rich local details at prohibitive computational cost (e.g., Transformer-based approaches with quadratic
  complexity) or achieve efficient global modeling but sacrifice fine-grained structural awareness (e.g.,
  state-space models). This trade-off hinders deployment in resource-constrained scenarios. We present
  LayoutMamba, a hybrid framework that synergistically combines sparse-attention Transformers for localized
  feature extraction (O(n) complexity) and the recurrent state-space mechanism of Mamba for dilution-free
  long-range dependency modeling across the 2D document canvas. Our two-stage paradigm first uses a lightweight
  Transformer encoder to hierarchically distill salient local semantics; second, Mamba propagates global
  contextual dependencies without attention dilution, enabling precise, efficient, and scalable layout
  understanding. We further identify a critical yet overlooked issue in existing DLA benchmarks: the inherent
  low-overlap distribution bias of layout objects, which we mitigate through a novel Geometric Overlap
  Penalty Loss (GOPLoss), a dual-optimization objective that minimizes redundant bounding box overlaps
  and encourages geometrically consistent predictions. Extensive experiments on PubLayNet and D4LA show
  that LayoutMamba surpasses state-of-the-art AP on PubLayNet with 8x fewer parameters and maintains leading
  performance on D4LA, ranking top-3 among published methods, achieving an unprecedented balance between
  accuracy, efficiency, and scalability. Our work pioneers a cognition-inspired paradigm for document
  analysis, advancing practical deployment in edge computing and resource-limited environments.'
