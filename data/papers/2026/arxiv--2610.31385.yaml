summary: 'Visual document understanding is essential for acquiring knowledge from visually rich documents
  and is attracting growing research interest. Existing surveys emphasize architectures or technical approaches,
  with limited attention to how task bottlenecks shape technical choices and research priorities. We present
  a task-centric survey that decomposes long-document visual question answering (VQA) into four components:
  document parsing, evidence organization and retrieval, generator organization and learning, and evaluation.
  For each, we develop a fine-grained taxonomy and trace motivations, technical responses, and cross-component
  connections. We focus on explicit retrieval while covering direct reading. Our temporal analysis traces
  expanding priorities from multimodal content understanding to sufficient, high-fidelity evidence acquisition
  and sustained evidence management. We outline future directions in evidence sufficiency, verifiable
  and correctable understanding, and budget-aware coordination, with an outlook on continual document
  understanding.'
