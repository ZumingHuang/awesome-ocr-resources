summary: 'Land ownership in Bangladesh is recorded in Ana-Ganda-Kora-Kranti-Til, a base-16 positional
  fraction system with dedicated Unicode glyphs, no mainstream font, and no coverage in any OCR pipeline
  or tokenizer. The handwritten records that carry these fractions, RS Khatians, are the authoritative
  title record for millions of parcels and a frequent subject of civil litigation, yet no benchmark has
  asked whether a machine can read one. We introduce KhatianDoc, a four-task benchmark built from 107
  real RS Khatian records from the Vumi (land) Office of Munshiganj, Bangladesh: symbol recognition, base-16-to-decimal
  conversion, structured field extraction, and legal document question answering over 1,634 QA pairs.
  Ground truth was transcribed by hand, verified by a land-law practitioner to full agreement, and anonymized
  through positional tokens that keep the referential distinctions multi-hop questions depend on. We evaluate
  six multimodal LLMs (8B to 72B+, open and closed) under a fixed zero-shot protocol. Five QA categories,
  39.3% of our stratified set, return zero correct answers from every model; on the arithmetic task, every
  model that emits a number does worse than a constant-mean baseline, with exact- and near-match scores
  coinciding: decorrelation, not approximation. Auditing our own metrics surfaced two artifacts in opposite
  directions: we correct a refusal-scoring bug and report the fixed scores beside the originals, and flag
  an inflated metadata metric as an upper bound. KhatianDoc documents not a performance gap but the absence
  of a capability, with verified ground truth for future systems. Code and data, with a redacted image
  release, are publicly available.'
