summary: While mining parallel sentences from web pages has proven effective for low-resource machine
  translation, the majority of the world's languages have little to no web presence. What they do have,
  though, are resources that are the result of centuries of efforts by linguists, such as grammars, dictionaries,
  and other documentation materials. We propose extracting translation examples from such linguistic resources,
  which offer parallel data for languages under-represented online and could potentially scale to thousands
  more languages. We develop a pipeline to achieve this, leveraging an Optical Character Recognition (OCR)
  model as well as a vision language model (VLM), to ensure identified content to be aligned with visual
  layout information. We demonstrate the utility of the extracted bitexts for bootstrapping translation
  systems across 20 languages, both by training machine translation models and by applying in-context
  learning for large language models. For in-context learning, we observe improvements of +15.78 and +6.94
  chrF2++ over zero-shot translation for into low- and high-resource languages, respectively.
