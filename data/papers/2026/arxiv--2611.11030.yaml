name: 'Building and Auditing Chemical Datasets with LLMs: A General LLM-as-a-Judge Framework Applied to
  Homogeneous Catalytic PET Depolymerisation'
released_at:
  value: '2026-11-08'
  precision: day
added_at: '2026-11-10'
