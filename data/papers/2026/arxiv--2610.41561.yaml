summary: 'This study examines digital sovereignty in professional translation through a screening of computer-assisted
  translation tools and translation management systems, and a case study of migrating a translator''s
  workstation from Windows to Linux. The framework combines three principles - Control, Continuity and
  Exit - with three practical requirements: native Linux operation, independence from mandatory external
  services, and independent access to essential data and resources. Drawing on documentary evidence and
  the limited number of responses received from providers, the ecosystem screening distinguishes Linux
  accessibility from operational independence: browser-based platforms may remain dependent on provider-controlled
  infrastructure. The migration case demonstrates the feasibility of reconstructing one professional workflow
  around a locally operable Linux core, using LoopCAT, LibreOffice and locally run TranslateGemma, alongside
  tools for optical character recognition, communication, credential management and backup. Selected cloud
  services remained available where needed. The findings suggest that digital sovereignty depends on how
  workflow dependencies are organized, rather than on individual applications or operating systems. It
  does not require technological isolation, but meaningful control over essential components, continuity
  of work and practical exit options. The framework is tailored to the case examined here and may require
  adaptation to other professional workflows.'
