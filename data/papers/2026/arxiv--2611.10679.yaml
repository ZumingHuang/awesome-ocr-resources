summary: 'Document parsing benchmarks are often treated as stable measures of model quality, yet rankings
  may depend substantially on benchmark design choices. In this work, we present RankShift, a systematic
  study comparing OCR and vision-language models (VLMs) under controlled variation in dataset composition,
  matching strategy, and scoring methodology. Using OmniDocBench as a case study, we evaluate the ranking
  stability of 16 models across 3 dataset configurations, 6 matching strategies, and 3 scoring metrics.
  We quantify rank stability using pairwise rank correlation, top-k churn, and pairwise reversal rate.
  Our results show that the interaction between matching strategy and ground truth format is a substantial
  but understudied driver of instability: scoring against OmniDocBench''s JSON annotations versus its
  Markdown rendering yields a mean Kendall''s tau of approximately 0.33 under region-level matching strategies,
  with individual pairs as low as tau = 0.23, compared with tau = 0.77 when each page is scored as a single
  concatenated string. Dataset composition produces comparable instability across page-type strata (mean
  tau = 0.48) and layout-type strata (mean tau = 0.49), while the cross-dataset shift from OmniDocBench
  to Real5''s Scanning reconstruction of the same pages is more stable (tau = 0.80). Metric choice is
  the most stable dimension, with mean tau of approximately 0.78 across NED, BLEU, and METEOR. These findings
  indicate that leaderboard position is not solely a property of model capability, motivating leaderboards
  that report not only headline scores but also the robustness of rankings across reasonable design choices.'
