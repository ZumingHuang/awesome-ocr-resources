summary: While large vision-language models excel at optical character recognition, it remains unclear
  how their underlying vision encoders process text and its meaning, and whether they support anything
  resembling reading comprehension. We systematically study transformer-based vision encoders, using cross-modal
  alignment between rendered text and visual concepts together with probing and retrieval-based analyses
  as a controlled window into these broader capabilities. Our layer-wise analyses span orthographic, grammatical,
  and semantic organization, and reveal that strong cross-modal mapping emerges only in the deepest layers,
  after unimodal object and text recognition have already developed, coinciding with a progression from
  surface-level to semantic representations. Although this hierarchy is strongest in contrastively trained
  models, larger self-supervised models and text-rich training data partially support similar behaviors
  without explicit language supervision. Together, our results suggest that increasing model and training-data
  scale, as well as text-rich training data, can partially compensate for the absence of language supervision.
