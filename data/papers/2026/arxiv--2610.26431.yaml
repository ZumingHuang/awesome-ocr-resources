summary: While VideoLLMs have made significant progress in understanding short video benchmarks, they
  often struggle to summarize long-form ones. This is mainly due to performance degradation caused by
  long-context prompts, the inherent difficulty of preserving temporal continuity and a lack of semantically
  rich concepts in event descriptions. To tackle these issues, this paper introduces the first recursive
  Video Language Summarization Model (RVLSM) designed for video processing and tailored to long-form video-to-text
  summarization. RVLSM recursively decomposes videos into semantically coherent segments and delegates
  chunk-level reasoning to VideoLLM sub-models and external tools. It employs (1) Semantic Temporal Decomposition
  (STD), which preserves temporal coherence and continuity through a scene-aware chunking strategy that
  dynamically partitions videos according to semantic boundaries, and (2) Adaptive Multimodal Tool Calling
  (AMTC), which ensures semantic richness of the summary via a routing mechanism that selectively invokes
  auxiliary modules such as action recognition, optical character recognition, automatic speech recognition,
  and object detection. Experiments on the VideoXum and MixTyVSum benchmarks show that RVLSM consistently
  improves over zero-shot VideoLLM baselines across multiple model settings and performance metrics, and
  is competitive with a state-of-the-art fine-tuned model for video-to-text summarization. Importantly,
  the named entities in the RVLSM's summaries align more closely with those detected in the ground-truth
  summaries than those detected by baseline and state-of-the-art methods, confirming the saliency of the
  event descriptions it generates.
