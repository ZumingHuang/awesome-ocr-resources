summary: Vision-language models (VLMs) have been widely adopted for document parsing and optical character
  recognition (OCR), as they can accurately extract page-level elements. However, downstream applications
  such as retrieval-augmented generation (RAG) also require coherent document-level structure. Although
  these models indicate heading levels using different numbers of preceding ``\#'' symbols, page-by-page
  prediction often lacks document-level consistency. In practice, input-resolution and context-length
  constraints make it infeasible for a VLM to jointly process all page images in documents containing
  tens or hundreds of pages. To address this limitation, we propose a VLM-based framework that incrementally
  reconstructs heading hierarchies with a \emph{level-wise multimodal memory}. The memory retains a compact
  subset of all previously processed pages, selected by anchors. Our framework supports flexible anchor
  selection, and in this work we select the most recent node at each level, allowing the VLM to observe
  the visual, textual, and layout patterns of headings at every level. For comprehensive evaluation, we
  also introduce the Complex and Long Document Heading Hierarchy Reconstruction Benchmark (CLDoc-HHRBench),
  comprising 250 documents and 11,212 pages with expert-verified annotations. Experiments on CLDoc-HHRBench
  and three existing benchmarks demonstrate the effectiveness of our method.
