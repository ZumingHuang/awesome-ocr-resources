summary: 'Multimodal sarcasm detection requires textual, visual, and contextual evidence, particularly
  when multiple images provide complementary cues. Multimodal large language models (MLLMs) can generate
  auxiliary information from a post''s text and images, but their outputs may mix useful background knowledge
  with redundant visual descriptions. We propose SEAF, a dual-branch framework for selective semantic
  enrichment and visual evidence fusion. SEAF assigns generated fields to distinct roles: entity background
  enriches semantic input, while image descriptions supply alignment statistics. The semantic branch combines
  the original post text, background from a frozen MLLM, and optical character recognition (OCR) text.
  The aligned visual branch combines global and local visual features with statistics of cross-modal and
  inter-image similarity. Text-Anchored Smoothed Aggregation (TASA) weights images by their similarity
  to the original post text while preserving contributions from images with low literal similarity. Summing
  the branch classification scores integrates contextual semantics with visual evidence. Experiments on
  the multi-image MMSD3.0 benchmark show that SEAF outperforms all compared methods.'
