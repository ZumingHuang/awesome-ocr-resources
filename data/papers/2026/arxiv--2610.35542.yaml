summary: Long-context multimodal document question answering (QA) has become an important yet challenging
  task for modern vision-language models (VLMs), as it requires reasoning over evidence dispersed across
  pages and modalities within limited input budgets. Current pipelines adopt retrieval-augmented generation
  (RAG) to select multimodal evidence for downstream VLMs. However, existing systems mainly rely on static
  selection rules over fixed-granularity retrieval units such as pages or blocks, resulting in information
  loss during retrieval and suboptimal performance in downstream reasoning. To alleviate these issues,
  we formulate the core task as budget-aware evidence selection over structured document evidence and
  propose HyperDoc, a document RAG framework that constructs compact yet sufficient evidence while preserving
  document relations. Specifically, HyperDoc constructs a document hypergraph to explicitly capture structural,
  logical, and cross-modal relationships among multimodal document elements. Over this structured evidence
  space, HyperDoc performs adaptive cost-aware hyperedge selection based on query intent and input budget.
  Extensive experiments on three representative benchmarks demonstrate that HyperDoc outperforms various
  types of state-of-the-art baselines.
