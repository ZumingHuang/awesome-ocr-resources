summary: An optical character recognition (OCR) can scan a paper and extract text using technology, making
  people's jobs easier. While various OCR systems are available in the software industry, finding a reliable
  equivalent solution for Bangla takes much work. When it comes to handwritten texts, the situation is
  much more unusual. Recognizing words from word images is the most critical stage in any OCR process.
  It is the second stage after segmenting words from text pictures. If this stage fails, the overall performance
  of the OCR will be poor, regardless of how well the other phases perform. This study aims to recognize
  words using deep learning in a handwritten Bangla word image. Three object detection models, SSD with
  MobileNetV2, Faster R-CNN with InceptionResNetV2, and an ensemble model of these two, have been used
  to train and test handwritten word images. A modified Non-Maximum Suppression has been introduced to
  enhance the effectiveness of the models' results. A customized dataset of 9841 handwritten Bangla word
  images has been compiled, featuring diverse handwriting styles from various individuals. All three models'
  performances have been checked against the test dataset, and the ensemble model has been the most impressive,
  with an F1-score of 92.61%. Also, at the word level, the ensemble model correctly recognizes 96.12%
  of the words to some extent. The system can be further improved by introducing a post-processing phase
  to correct errors generated by the system.
