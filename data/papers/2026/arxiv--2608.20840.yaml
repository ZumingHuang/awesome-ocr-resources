summary: Recent advances in multimodal retrieval have improved the ability to retrieve information from
  visually rich documents such as PDFs and reports. However, existing benchmarks remain largely centered
  on English and provide limited coverage of Korean visual documents with complex structures. Furthermore,
  most existing Korean resources primarily evaluate single-page retrieval, failing to capture realistic
  scenarios that require evidence aggregation across multiple pages. To address these gaps, we introduce
  KoViDoRe, a benchmark for Korean visual document retrieval. The dataset is constructed from publicly
  available Korean documents with diverse layouts, including tables, figures, and multi-column structures.
  We develop a multi-stage data curation pipeline consisting of structured document parsing, synthetic
  query generation using both summary-based and context-based strategies, and relevance mapping with human
  verification. Using KoViDoRe, we evaluate a wide range of multimodal retrieval models and observe that
  current models struggle to effectively handle Korean visual document retrieval, particularly in settings
  involving structured content and diverse query types. Motivated by this finding, we further curate a
  large-scale training dataset, Ko-VDR Train Public, to support the development of retrieval models tailored
  to Korean visual documents. Together, KoViDoRe and Ko-VDR Train Public provide a unified benchmark and
  training resource for Korean visual document retrieval.
