summary: Answering questions over long multimodal documents requires locating relevant evidence across
  pages containing text, tables, and figures. When the document exceeds the model's context window, selective
  retrieval becomes necessary. We introduce VistaTree, a document question-answering agent that builds
  a summary tree directly from rendered page images. VistaTree segments documents into contiguous page
  spans, recursively groups them into a topic hierarchy, and refines sibling summaries to distinguish
  neighboring sections. At query time, the agent uses node summaries to select relevant nodes and reads
  the corresponding pages, using hierarchical navigation when the full outline exceeds the context budget.
  Experiments on MMLongBench-Doc and LongDocURL evaluate answer quality and retrieval cost using a locally
  hosted vision-language model, and quantify the performance gap between global and hierarchical access
  to the index.
