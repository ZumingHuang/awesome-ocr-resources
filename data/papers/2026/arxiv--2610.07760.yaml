summary: Retrieval-augmented generation systems can route difficult queries to deeper context, but batch
  deployments must allocate a shared token budget across calls whose costs vary by query. We formulate
  selective escalation as finite-batch allocation for financial document question answering. Each of 150
  FinanceBench questions first receives a top-1 retrieval answer. Predictors estimate the adjudication-quality
  gain and token cost of an optional top-5 call, and the allocator prioritizes calls by predicted gain
  per token. At the nominal 10% budget, gain-per-token allocation improves adjudication quality over gain-only
  ranking by 0.034 (95% document-bootstrap CI [0.001, 0.072]) while using 46.6% fewer total tokens than
  one-pass top-5 retrieval. Additional-call cost is accurately predictable (R-squared 0.93), whereas beneficial
  escalation remains difficult to rank (AUROC 0.60). These results show that heterogeneous cost is actionable
  under tight constraints, while progress across the full budget frontier depends on stronger query-specific
  benefit estimates.
