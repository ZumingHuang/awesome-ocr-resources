summary: End-to-end full-page document parsing must preserve the content and structure of heterogeneous
  elements, yet otherwise accurate outputs can contain local errors and omissions. A single page-level
  advantage does not explicitly identify which elements differ in quality across sampled outputs or where
  their errors occur. We introduce Page-to-Token Policy Optimization (P2TPO), a structure-aligned credit-assignment
  framework that operates on full-page policy trajectories. Reference-element alignment first associates
  block-level quality contrasts with generated spans. Unified Anchor Pricing (UAP) incorporates matched
  and missing element outcomes and provides feedback relative to a fixed quality ceiling when sampled
  outputs receive identical but imperfect scores for a reference element. Within matched blocks, Span
  Credit Redistribution (SCR) redistributes existing block credit according to aligned correct and erroneous
  spans, using boundary proxies for within-block omissions while preserving the total block-derived advantage
  across its tokens. Under a fixed-weight additive page utility, we show that element-indexed contrasts
  retain local quality differences that page-level aggregation can cancel out. In the main experimental
  comparison, P2TPO outperforms all evaluated policy optimization baselines in seed-averaged scores on
  each of the six document parsing benchmarks. Additional experiments demonstrate gains across model scales
  and initializations.
