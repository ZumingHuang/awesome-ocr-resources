summary: 'Optical Character Recognition (OCR) is among the oldest and most widely deployed applications
  of artificial intelligence. This survey reviews its development, focusing on the Foundation Model Era.
  We define OCR through faithful transcription: within a specified visual scope, OCR should completely
  reconstruct the text, notation, and document structure observable in the source image, and every textual,
  notational, or structural element in the output must be verifiable from visual evidence in that image.
  We trace the development from specialist OCR models toward unified models, examining joint text detection
  and recognition, structured sequence generation, and the use of pretrained vision-language models (VLMs).
  We organize contemporary OCR systems into five coexisting families: modular toolkits and task-specific
  models, specialized document VLMs, hybrid workflows, general-purpose VLMs, and commercial products and
  managed services. We compare their architectures, data, and training, examining hallucination and omission,
  insufficient spatial grounding, and inference cost in generative OCR. We review evaluation from character
  and scene text recognition to parsing individual structural elements and full-page transcription, highlighting
  gaps in consistent output definitions, attribution of performance to individual components, and coverage
  of real capture conditions and visible content and structure. Finally, we summarize the challenges facing
  OCR and discuss directions for future research. We continuously track related work at https://github.com/zhihengli-casia/Awesome-OCR-in-the-Foundation-Model-Era.'
