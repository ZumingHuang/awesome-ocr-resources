summary: Optical character recognition (OCR) for handwritten Indic manuscripts is essential for large-scale
  digitization and computational access to manuscript heritage. However, existing approaches are typically
  developed for one script at a time and require substantial script-specific customization. This limits
  scalability and practical deployment across diverse collections. We present UniLipi, a unified multi-script
  OCR model for handwritten Indic manuscripts trained jointly across 13 Indic scripts within a single
  framework. UniLipi directly handles realistic manuscript conditions, including extreme variation in
  line geometry, large variation in line length, and partial interruptions caused by non-textual manuscript
  entities such as holes, stains, or pictorial illustrations. To operate effectively under ultra low-resource
  conditions, the model leverages script-aware synthetic manuscript data generation, substantially reducing
  reliance on large volumes of real annotated data. Beyond historical manuscripts, we show that UniLipi
  serves as an effective foundational pretrained model. Specifically, its learned representations enable
  good OCR performance for contemporary Indic handwriting and extend to several non-Indic scripts, including
  Tibetan, Italian, Latin, and Chinese scripts. In addition to transcription, UniLipi predicts script
  identity and per-line native character counts, supporting practical manuscript cataloging workflows.
