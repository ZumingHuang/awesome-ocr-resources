summary: 'Play is used as an indicator of positive welfare in dairy calves, but openly available video
  of group-housed calves with individual behaviour annotations is scarce. We describe video from four
  camera deployments of about one week each in group pens of dairy calves on two farms in the Netherlands:
  a research and teaching dairy farm (2024 and 2025) and a commercial dairy farm (2024). The recordings
  comprise 1,173 video files spanning 651 h. For eight observation days, trained observers coded calf
  behaviour continuously in Noldus The Observer XT with an 18-item ethogram of play and other behaviours,
  covering 104 h of video, 90 h of which have every calf in the pen coded. The release also contains 1.1
  million decoded frames from seven annotated sessions, a per-frame timestamp read by optical character
  recognition from the camera clock burned into each frame, per-calf segmentation tracks and per-calf
  frame-level play labels. The data support studies of calf behaviour and welfare and the development
  and evaluation of automated behaviour recognition.'
