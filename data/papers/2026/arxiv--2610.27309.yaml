summary: Optical Character Recognition (OCR) and handwritten character recognition (HCR) in low-resource
  historical material collections often rely on data augmentation, yet augmentation strategies are typically
  evaluated almost exclusively through predictive accuracy. This leaves open whether a model's improved
  performance is accompanied by saliency stability. This question is important in low-resource historical
  HCR, where recognition is performed on variable and partially degraded letterforms and two models with
  similar predictive performance may differ in how consistently their saliency patterns respond to such
  variation. We therefore study saliency-guided augmentation as an explanation-aware strategy for low-resource
  HCR. Rather than treating saliency maps only as post-hoc interpretations, we use them to define augmentation
  variants that perturb, preserve, or constrain visually informative regions of character images. We compare
  classical document-style transformations, random lacunae, and several saliency-constrained lacuna variants.
  To evaluate the effect of augmentation beyond accuracy, we introduce the Explainability Consistency
  Index (ECI), a metric that quantifies the stability of saliency patterns under controlled perturbations.
  We find that saliency-constrained augmentation can improve recognition over classical augmentation,
  but no single saliency strategy is consistently best. The preferred form of the constraint varies with
  both architecture and corpus, indicating that saliency is better treated as a mechanism for controlling
  augmentation than as a fixed augmentation strategy. In some settings, saliency-constrained training
  improves explanation consistency even when predictive performance is similar. This shows that predictive
  metrics alone can obscure differences in model sensitivity under perturbation, motivating explanation
  consistency as a complementary evaluation dimension.
