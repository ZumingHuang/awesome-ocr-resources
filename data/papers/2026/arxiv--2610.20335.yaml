summary: Document understanding systems are typically evaluated as separate components via layout analysis,
  optical text recognition, reading-order prediction, and image captioning. This separation leaves scientific
  figures, captions, and visual semantics weakly connected, and fails to measure whether a model can produce
  a single page-level parse that is both structurally faithful and semantically accessible. We introduce
  Read-Parse-Describe, a unified dataset for document parsing with visual element description generation.
  Given a page image, models are required to output an ordered list of layout elements containing bounding
  boxes, semantic labels, reading-order indices, recognized textual content, and alternative text descriptions
  for visual elements. The benchmark is built from 2,402 documents, comprising 18,163 continuous pages,
  125,218 layout elements, and 11,338 visual instances. Besides, we further propose a plug-and-play space-awareness
  enhancer that reuses multi-layer visual features and injects grid-aware spatial guidance into vision-language
  tokens for layout-aware generation. Experiments across end-to-end VLMs and pipeline parsers show that
  existing systems still struggle to jointly recover reading order and visual semantics, while our enhanced
  model achieves strong joint performance. These results highlight the need to move beyond isolated document
  parsing modules toward unified models that jointly read, parse, and describe complex documents. The
  new dataset and code will be made publicly available at https://github.com/yufanchen96/RPD
