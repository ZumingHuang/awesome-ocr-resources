summary: Financial documents combine narrative disclosures, accounting metrics, corporate structures,
  management commentary, and time-dependent facts, making them difficult to represent using conventional
  chunk-based retrieval-augmented generation systems. This paper presents an auditable, schema-driven
  methodology for constructing temporal financial knowledge graphs from page-delimited documents parsed
  using a general purpose document intelligence service. Overlapping document windows undergo phased large
  language model extraction of structural entities, quantitative observations, and domain-specific relationships.
  Candidate graph elements are validated against predefined schemas and consolidated through scope-aware
  exact, normalized, fuzzy, embedding-based, and LLM-assisted entity resolution. Temporal merge constraints,
  deterministic edge deduplication, conflict-aware property management, and fine-grained provenance preserve
  issuer identity, reporting-period validity, and traceability to source evidence. The contributions of
  this work comprise the proposed methodology for financial knowledge graph construction, the creation
  of an evidence-grounded temporal knowledge graph from heterogeneous financial documents, and an intrinsic
  framework for evaluating the quality of the resulting graph. The evaluation framework assesses seven
  weighted dimensions, two hard validation gates, and structural diagnostics. By separating graph-quality
  assessment from downstream retrieval and answer generation, the framework supports systematic diagnosis
  and iterative refinement of the constructed graph.
