summary: Geospatial text spotting involves locating and transcribing geographic labels, such as road names,
  district names, and landmarks, in raster maps. These labels are often small, densely arranged, and arbitrarily
  oriented. Although Arabic text recognition has been studied extensively in documents and natural scenes,
  Arabic geospatial text spotting remains underexplored. We introduce ARABGEOTEXT, an Arabic-centric benchmark
  covering 970 geographic locations in Riyadh and Jeddah, with 17,875 manually annotated text instances
  per view type. For each location, we pair an OpenStreetMap (OSM) rendering with a composite created
  by overlaying that rendering on the corresponding remote sensing (RS) imagery. The paired views preserve
  label content and pixel geometry, allowing evaluation across different backgrounds. Geographic partitions
  support in-city and city-disjoint evaluation of detection, recognition, and end-to-end spotting. Experiments
  with direct Qwen3.5-4B spotting show difficulties in recovering all labels within a tile. We therefore
  propose a tool-augmented vision-language framework that combines YOLO26 localization and crop rectification
  with Qwen3.5-4B recognition adapted through low-rank adaptation (LoRA). The framework outperforms direct
  LoRA-adapted Qwen3.5-4B spotting across both image views and test cities. With localization held fixed,
  reader adaptation further improves recognition over the pretrained zero-shot reader. The dataset and
  code will be made publicly available at https://github.com/yakoubbazi/ArabGeoText.
