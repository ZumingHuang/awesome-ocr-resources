summary: "\n\t\n\t\t\n\t\n\t\n\t\tSinhala and Pali OCR: old prints\n\t\n\nThese are scanned pages of Sinhala\
  \ and Pali books, mostly Buddhist texts printed between the 1870s and 2000s, each paired with a corrected\
  \ transcription. They were collected to fine-tune a page-level OCR model (e.g. LightOnOCR-2) for old\
  \ Sinhala-script print, made by Path Nirvana.\n\n\t\n\t\t\n\t\n\t\n\t\tTarget format\n\t\n\nEach target\
  \ is the page text as UTF-8 Unicode Sinhala (NFC):\n\nLines: one printed line becomes one line of text.\
