summary: >-
  Synthetic laboratory reports with a computed answer key for OCR and key information extraction: 4,000 fictional
  reports (5,331 pages) in US, UK, German, Spanish, Romanian and French conventions and 14 page layouts, each as a
  born-digital PDF and as a clean scan, a noisy scan and a simulated phone photo. Every printed result has an answer
  row with value, unit, reference interval, flag and bounding boxes; 730 lines are marked for abstention.
  [Zenodo DOI](https://doi.org/10.5281/zenodo.24341108) · [lab-reading-bench](https://github.com/caraulani/lab-reading-bench).
