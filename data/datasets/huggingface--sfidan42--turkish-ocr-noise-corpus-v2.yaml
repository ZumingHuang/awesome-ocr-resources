summary: "\n\t\n\t\t\n\t\n\t\n\t\tTurkish OCR Noise Corpus, version 2\n\t\n\nThis corpus contains rendered\
  \ Turkish document pages under one clean condition and five synthetic degradations, together with their\
  \ PP-OCRv5 transcriptions. It supports the study of how OCR errors affect dense retrieval of Turkish\
  \ question-answer text (Chapter 6 of the thesis cited below).\nVersion 2 keeps the pages, the clean\
  \ renders and the blur and low-resolution images of version 1. It makes rotation, noise and JPEG compression\
  \ harsher… See the full description on the dataset page: https://huggingface.co/datasets/sfidan42/turkish-ocr-noise-corpus-v2."
