summary: "\n\t\n\t\t\n\t\n\t\n\t\tN'Ko OCR Dataset\n\t\n\nTraining dataset for N'Ko (ߒߞߏ) optical character\
  \ recognition — the script of Manding languages (Bambara, Maninka, Dioula), ~50 million speakers in\
  \ West Africa.\nBuilt from scratch (Oct 2026) because no usable N'Ko OCR dataset existed anywhere.\n\
  \n\t\n\t\t\n\t\n\t\n\t\tContents\n\t\n\n\n4,422 PNG images + transcriptions (.gt.txt) + Tesseract box\
  \ files (.box)\n2,211 unique N'Ko lines (Bambara, Mali), each rendered in 2 variants (clean 40pt / noisy\
  \ 32pt)\n2 fonts: Noto Sans NKo… See the full description on the dataset page: https://huggingface.co/datasets/koussedia/nko-ocr-dataset."
