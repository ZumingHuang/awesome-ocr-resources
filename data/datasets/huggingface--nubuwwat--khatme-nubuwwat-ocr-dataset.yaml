summary: "\n\t\n\t\t\n\t\n\t\n\t\tKhatme-Nubuwwat Urdu OCR Corpus\n\t\n\nThis is a structure-aware, fully\
  \ OCR'd text dataset of around 215 Urdu Khatme Nubuwat books/volumes (approximately 86,557 pages of\
  \ text). The text dataset is paried with source-page scans.\nThe books are composed of Nastaliq prose\
  \ with heavy references to Quran and Hadith. Effort was made to ensure that the OCR pipeline transcribed\
  \ the text verbatim without any modifications. The transcribed pages were passed through a multi-signal\
  \ accuracy layer… See the full description on the dataset page: https://huggingface.co/datasets/nubuwwat/khatme-nubuwwat-ocr-dataset."
