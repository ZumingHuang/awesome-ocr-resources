summary: "\n\t\n\t\t\n\t\n\t\n\t\tSaraiki OCR Poetry Dataset (Gemini-generated, Jataki dialect)\n\t\n\n\
  Original Jataki Saraiki poems generated by Gemini, quality/dialect-purity judged, then rendered as images\
  \ with the Mehr Nastaliq Saraiki font (RAQM-shaped for correct Perso-Arabic joining) -- for OCR / text-recognition\
  \ training.\nRow format:\n{\"id\": ..., \"image\": <PIL image>, \"text\": \"<poem, \\n-separated lines>\"\
  ,\n  \"length_category\": \"short|medium|long\", \"line_count\": ..., \"word_count\": ..., \"judge_score\"\
  : ...}… See the full description on the dataset page: https://huggingface.co/datasets/themohal/saraiki-ocr-poetry-dataset."
