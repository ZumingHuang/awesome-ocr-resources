summary: "\n\t\n\t\t\n\t\n\t\n\t\tTibetan OCR Diagnostic Benchmark (OFAT)\n\t\n\nA small, controlled diagnostic\
  \ OCR benchmark of 300 synthetic Tibetan pecha-page images with exact, noise-free ground truth.\nIt\
  \ is a scientific instrument for measuring how OCR character error rate (CER) responds to individual\
  \ difficulty factors one at a time (OFAT) — not a coverage-maximizing training set.\nCode & regeneration:\
  \ https://github.com/buda-base/synthetic-ocr-benchmark-tools (diagnostic_benchmark/)\n\n\t\n\t\t\n\t\
