summary: "\n\t\n\t\t\n\t\n\t\n\t\tHandwriting OCR (Lance Format)\n\t\n\nThis Lance-formatted version of\
  \ the Doctor's Handwritten Prescription BD dataset contains 4,680 cropped PNG images of handwritten\
  \ medicine names from Bangladesh. Each row keeps the original image bytes with the medicine and generic-name\
  \ labels, plus deterministic search metadata derived from those labels. The dataset contains three source-preserved\
  \ splits: train, validation, and test.\n\n[!NOTE]\nTraining note: The same samples appear repeatedly…\
