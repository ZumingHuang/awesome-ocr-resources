summary: "\n\t\n\t\t\n\t\n\t\n\t\tocr_data\n\t\n\nSynthetic Arabic document images with layout annotations,\
  \ for OCR training.\n\n\t\n\t\t\n\t\n\t\n\t\tLayout\n\t\n\nWebDataset .tar shards. Files sharing a basename\
  \ are one sample, so the\nimage becomes the image column and the annotation the json column.\ndata/<contributor>_<NNN>.tar\
  \            originals (PNG + JSON)\ndata_aug/<contributor>_<NNN>_aug<K>.tar augmented variants (JPEG/PNG\
  \ + JSON)\n\nEach shard holds up to 9990 samples (~1.2 GB). data/ and data_aug/\nare separate so you\
  \ can train… See the full description on the dataset page: https://huggingface.co/datasets/OCR-Data/ocr_data."
