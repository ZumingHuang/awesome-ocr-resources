  \ Foundation. One line reader (CRNN + CTC) for all the alphabets Abkhaz\nhas been printed in:\n\nmodern\
  \ Abkhaz Cyrillic;\nthe Georgian-based alphabet of 1938–54;\nthe Latin alphabet of 1928–38, and Marr's\
  \ analytic alphabet of 1926–28;\npre-1926 Abkhaz Cyrillic.\n\nThis repository holds the trained reader\
  \ (model/), the code that runs it (code/), and\nthe exact training set it was trained on with the weights\
