summary: "\n\t\n\t\t\n\t\n\t\n\t\tСинтетические строки якутского текста для OCR\n\t\n\n500 000 изображений\
  \ строк с точной разметкой. Сделано для обучения\nраспознавателя якутского (саха) текста: готовые движки\
  \ для этого языка не\nработают, а размеченных строк почти нет.\nЗачем вообще синтетика: у tesseract-rus\
  \ и ABBYY FineReader 10 на якутской\nпечати доля правильно прочитанных специфических букв ҕ ҥ ө һ ү\
  \ равна нулю.\nНе «низкая» — ноль на 460 тысячах букв, при том что эти буквы составляют около\n7% всех\
  \ букв и встречаются… See the full description on the dataset page: https://huggingface.co/datasets/lab-ii/sakha-ocr-synth."
