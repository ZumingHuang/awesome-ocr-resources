summary: "\n\t\n\t\t\n\t\n\t\n\t\tGemma OCR Lines (IAM + KHATT)\n\t\n\nLine-level image/text pairs for\
  \ training a CTC OCR recognizer. Every row is one\ncropped text line with its transcript: handwriting\
  \ from IAM (English) and\nKHATT (Arabic), normalized into a single Latin+Arabic character vocabulary.\n\
  This is the frozen training corpus for the embedding-ocr CTC recognizer.\nIt exists so training never\
  \ has to download the upstream datasets, re-filter\nrows, or write tens of thousands of PNGs again.\
  \ The corpus was packed… See the full description on the dataset page: https://huggingface.co/datasets/MohamedEmam2/gemma-ocr-lines."
