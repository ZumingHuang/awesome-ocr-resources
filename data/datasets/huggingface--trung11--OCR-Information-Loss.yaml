summary: "\n\t\n\t\t\n\t\n\t\n\t\tOCR Information Loss\n\t\n\nTask annotations for measuring how much\
  \ historical information is lost to OCR errors, from the paper Not All OCR Errors Are Equal: Measuring\
  \ Historical Information Loss. The annotations cover named entities (NER), entity links to Wikidata\
  \ (EL) and retrieval queries (IR) on the test partition of HIPE-OCRepair-2026 (v0.9), which pairs ground-truth\
  \ (GT) and OCR transcriptions of historical newspapers in English, French and German.\nCode:… See the\
  \ full description on the dataset page: https://huggingface.co/datasets/trung11/OCR-Information-Loss."
