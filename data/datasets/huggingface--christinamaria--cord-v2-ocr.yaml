summary: "\n\t\n\t\t\n\t\n\t\n\t\tCORD-v2 text-only — receipt OCR text → structured JSON\n\t\n\nA text-only\
  \ derivative of CORD-v2 (Consolidated Receipt Dataset; Park et al., 2019), the standard benchmark for\
  \ document information extraction used by Donut and similar models. The original dataset pairs 1,000\
  \ receipt photos with a rich ground-truth schema (~30 field types across 4 groups, including menu line\
  \ items). This version drops the images and pairs the OCR text of each receipt with its target parse,\
  \ so text-only… See the full description on the dataset page: https://huggingface.co/datasets/christinamaria/cord-v2-ocr."
