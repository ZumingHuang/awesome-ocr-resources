summary: "\n\t\n\t\t\n\t\n\t\n\t\tOCR-Injection-DE\n\t\n\nA synthetic German document corpus to measure\
  \ image prompt injection against document vision-language models: does a model\ntranscribe and extract\
  \ what is on the page, or does it follow (or copy) instructions and fake data hidden in the document,\
  \ or\nreplace document content with a prior planted in the system prompt? The corpus comes with ground\
  \ truth, a rule-based scorer\n(no LLM judge) and the raw answers of all measured models.\nAll documents,\
  \ names, companies… See the full description on the dataset page: https://huggingface.co/datasets/keyvan-ai/OCR-Injection-DE."
